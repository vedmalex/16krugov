<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Прототип экрана чтения джапы — 16 кругов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --paper: #f3eadc;
      --card: #fffaf3;
      --ink: #241910;
      --muted: #6d5848;
      --line: #e2d3c0;
      --accent: #b8431f;
      --accent-ink: #fff7f2;
      --surface-soft: #eadcc9;
      --shadow: 0 18px 40px rgb(60 32 12 / 10%);
      --reading-scale: 1;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #1b1612;
      --card: #28211b;
      --ink: #f6efe6;
      --muted: #cbb8a6;
      --line: #43362c;
      --accent: #e07a45;
      --accent-ink: #1b120e;
      --surface-soft: #332a23;
      --shadow: 0 18px 40px rgb(0 0 0 / 35%);
    }

    :root[data-theme="stand-dim"] {
      color-scheme: dark;
      --paper: #120e0b;
      --card: #17120e;
      --ink: #d8cab8;
      --muted: #9f8d7c;
      --line: #2d231c;
      --accent: #c96b3b;
      --accent-ink: #140d09;
      --surface-soft: #201914;
      --shadow: none;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans", system-ui, -apple-system, sans-serif;
      background: #171412;
      color: #f3eadc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    button, select, input { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* Top Lab Bar (Prototype Controls) */
    .lab-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      padding: 10px 16px;
      background: #231d19;
      border-bottom: 1px solid #3c3129;
      font-size: 13px;
    }
    .lab-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .lab-label {
      color: #cbb8a6;
      font-size: 12px;
      margin-right: 2px;
    }
    .lab-btn {
      border: 1px solid #4d3f35;
      background: #2d2520;
      color: #f6efe6;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12.5px;
      transition: background 140ms ease, border-color 140ms ease;
    }
    .lab-btn:hover { border-color: #e07a45; }
    .lab-btn[aria-pressed="true"] {
      background: #e07a45;
      color: #1b120e;
      border-color: transparent;
      font-weight: 700;
    }
    .lab-select {
      background: #2d2520;
      color: #f6efe6;
      border: 1px solid #4d3f35;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 12.5px;
    }

    /* Stage Viewport */
    .lab-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: auto;
    }

    /* Device Frames */
    .device-frame {
      position: relative;
      background: var(--paper);
      color: var(--ink);
      border-radius: 22px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: width 220ms ease, height 220ms ease, border-radius 220ms ease;
    }
    .device-frame.form-desktop {
      width: min(1040px, 100%);
      height: min(680px, calc(100vh - 110px));
    }
    .device-frame.form-phone-landscape,
    .device-frame.form-stand {
      width: min(812px, 100%);
      height: 390px;
      border-radius: 34px;
      border: 8px solid #0e0c0a;
    }
    .device-frame.form-phone-portrait {
      width: 390px;
      height: min(720px, calc(100vh - 110px));
      border-radius: 34px;
      border: 8px solid #0e0c0a;
    }
    .device-frame.form-watch-round {
      width: 248px;
      height: 248px;
      border-radius: 50%;
      border: 10px solid #0e0c0a;
    }
    .device-frame.form-watch-rect {
      width: 226px;
      height: 274px;
      border-radius: 44px;
      border: 10px solid #0e0c0a;
    }

    /* Simulated Safe-area Notch for Phone Landscape */
    .notch-indicator {
      display: none;
    }
    .show-notch .form-phone-landscape .notch-indicator,
    .show-notch .form-stand .notch-indicator {
      display: block;
      position: absolute;
      left: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 92px;
      border-radius: 999px;
      background: #0e0c0a;
      z-index: 20;
      pointer-events: none;
    }
    .show-notch .form-phone-landscape .app-root,
    .show-notch .form-stand .app-root {
      padding-left: 24px;
      padding-right: 12px;
    }

    /* App Inside Device */
    .app-root {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--paper);
      color: var(--ink);
    }

    .tabular { font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }

    .btn-ghost, .btn-solid, .chip {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      min-height: 36px;
      transition: border-color 140ms ease, background 140ms ease, opacity 140ms ease;
    }
    .btn-ghost:hover, .chip:hover { border-color: var(--accent); }
    .btn-solid {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: transparent;
      font-weight: 700;
    }
    .btn-solid:disabled, .btn-ghost:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .icon-btn:hover { border-color: var(--accent); }
    .icon-btn.active-pause {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 16%, var(--card));
    }

    /* Banners */
    .banner {
      padding: 8px 14px;
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-soft);
    }
    .banner.alert {
      background: color-mix(in srgb, var(--accent) 16%, var(--card));
      border-color: var(--accent);
    }

    /* Header Bar (Desktop & Portrait) */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      flex-shrink: 0;
    }
    .top-bar-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }
    .progress-track {
      width: min(280px, 100%);
      height: 6px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 240ms ease;
    }
    .timers-inline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 13px;
    }
    .pause-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    /* Desktop Reading Layout */
    .desktop-main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 54px minmax(0, 720px) 54px;
      justify-content: center;
      gap: 8px;
      padding: 16px 16px 8px;
    }
    .edge-nav-btn {
      align-self: center;
      height: 160px;
      width: 48px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--accent);
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .edge-nav-btn:hover:not(:disabled) { border-color: var(--accent); }
    .edge-nav-btn:disabled { opacity: 0.25; cursor: default; }

    .reading-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px 26px;
      overflow-y: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow);
    }
    .form-stand .reading-card {
      border-color: transparent;
      box-shadow: none;
    }
    .card-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
    }
    .card-index {
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card-title {
      margin: 0;
      font-size: calc(1.18rem * var(--reading-scale));
      line-height: 1.35;
    }
    .sanskrit-block {
      margin: 0;
      font-family: inherit;
      white-space: pre-wrap;
      font-size: calc(1.06rem * var(--reading-scale));
      line-height: 1.75;
      overflow-wrap: anywhere;
    }
    .translation-block {
      margin: 0;
      font-size: calc(1.02rem * var(--reading-scale));
      line-height: 1.68;
      max-width: 62ch;
      overflow-wrap: anywhere;
    }
    .instruction-block {
      margin: 0;
      color: var(--muted);
      font-size: calc(0.94rem * var(--reading-scale));
      line-height: 1.6;
      max-width: 62ch;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
    }

    .bottom-action-bar {
      padding: 12px 16px 14px;
      border-top: 1px solid var(--line);
      background: var(--paper);
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }
    .primary-next-btn {
      width: min(720px, 100%);
      min-height: 56px;
      border-radius: 16px;
      font-size: 16px;
    }

    /* Phone Landscape Split Layout */
    .landscape-split {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 238px;
      gap: 12px;
      padding: 10px 12px;
    }
    .landscape-text-col {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
    }
    .form-stand .landscape-text-col { border-color: var(--line); }
    .landscape-text-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      flex-shrink: 0;
    }
    .landscape-text-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .landscape-control-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      min-height: 0;
      padding: 4px 2px;
    }
    .control-status-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .round-big {
      font-size: 19px;
      font-weight: 700;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .timer-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 13px;
    }
    .timer-row strong { font-size: 18px; }
    .icon-row {
      display: flex;
      gap: 8px;
      justify-content: space-between;
    }
    .landscape-next-btn {
      width: 100%;
      min-height: 62px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.2;
      padding: 8px 10px;
    }
    .is-paused-dim { opacity: 0.72; }

    /* Phone Portrait */
    .portrait-main {
      flex: 1;
      min-height: 0;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .portrait-main .reading-card {
      flex: 1;
      padding: 14px 16px;
    }

    /* Watch Layout */
    .watch-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 22px 18px;
      text-align: center;
      position: relative;
    }
    .form-watch-rect .watch-shell {
      padding: 14px 14px 14px;
    }
    .watch-mode-pills {
      display: flex;
      gap: 4px;
    }
    .watch-dot-btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      font-size: 10.5px;
      border-radius: 999px;
      padding: 2px 7px;
      min-height: 22px;
    }
    .watch-dot-btn[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: transparent;
      font-weight: 700;
    }
    .watch-big-num {
      font-size: 36px;
      font-weight: 700;
      line-height: 1.05;
    }
    .watch-text-scroll {
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow-y: auto;
      text-align: left;
      font-size: 13px;
      line-height: 1.45;
      margin: 6px 0;
      padding: 0 4px;
    }
    .watch-action-btn {
      position: relative;
      width: 88%;
      min-height: 44px;
      border-radius: 999px;
      font-size: 13px;
      overflow: hidden;
    }
    .hold-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: rgb(255 255 255 / 26%);
      width: 0%;
      pointer-events: none;
    }
    .watch-hw-btn {
      position: absolute;
      right: -14px;
      top: 50%;
      transform: translateY(-50%);
      background: #e07a45;
      color: #1b120e;
      border: 2px solid #0e0c0a;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      padding: 6px 4px;
      writing-mode: vertical-rl;
      z-index: 30;
    }

    /* Overlays (Full Text, Settings, History, Layouts) */
    .overlay-backdrop {
      position: absolute;
      inset: 0;
      background: rgb(16 12 8 / 55%);
      display: flex;
      justify-content: flex-end;
      z-index: 40;
    }
    .overlay-panel {
      width: min(440px, 100%);
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      border-left: 1px solid var(--line);
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .overlay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }
    .overlay-header h3 { margin: 0; font-size: 16px; }
    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      font-size: 13.5px;
    }
    .check-row input { width: 18px; height: 18px; accent-color: var(--accent); }

    /* Toast */
    .undo-toast {
      position: absolute;
      left: 50%;
      bottom: 74px;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--paper);
      padding: 8px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgb(0 0 0 / 28%);
      z-index: 35;
      white-space: nowrap;
    }
    .undo-toast button {
      border: 0;
      background: var(--accent);
      color: var(--accent-ink);
      border-radius: 999px;
      padding: 3px 10px;
      font-weight: 700;
      font-size: 12px;
    }

    /* Empty & Completion */
    .empty-box {
      border: 1px dashed var(--line);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .round-list {
      margin: 0;
      padding-left: 20px;
      display: grid;
      gap: 4px;
      font-size: 13.5px;
    }

    /* Articulation & Preparation Integration */
    .series-pills {
      display: flex;
      gap: 4px;
      height: 8px;
      width: 100%;
    }
    .series-pills.thin { height: 5px; }
    .series-pills button,
    .series-pills span {
      flex: 1;
      height: 100%;
      border: 0;
      padding: 0;
      border-radius: 999px;
      background: var(--line);
      transition: background 140ms ease;
    }
    .series-pills .current { background: var(--accent); }
    .series-pills .done { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }

    .stage-area {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 18px 20px;
      cursor: pointer;
      user-select: none;
      overflow-y: auto;
    }
    .stage-tokens {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px 14px;
      font-size: calc(1.55rem * var(--reading-scale));
      line-height: 1.45;
      text-align: center;
      max-width: 100%;
    }
    .stage-tokens.is-text {
      font-size: calc(1.12rem * var(--reading-scale));
      line-height: 1.85;
      gap: 4px 6px;
      max-width: 58ch;
      text-align: left;
      justify-content: flex-start;
    }
    .word-line {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 3px;
      padding: 2px 6px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper) 45%, var(--card));
    }
    .stage-tokens.is-text .word-line {
      border-color: transparent;
      background: transparent;
      padding: 0 2px;
    }
    .token {
      padding: 2px 4px;
      border-radius: 8px;
      transition: color 180ms ease, transform 180ms ease, text-shadow 180ms ease, background 180ms ease;
    }
    .token.active {
      color: var(--accent);
      font-weight: 700;
      transform: translateY(-2px) scale(1.08);
      text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 45%, transparent);
    }
    .form-stand .token.active {
      text-shadow: none;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
    }
    .token.preview {
      color: var(--accent);
      opacity: 0.72;
    }
    .pause-veil {
      position: absolute;
      inset: 0;
      background: color-mix(in srgb, var(--paper) 78%, transparent);
      backdrop-filter: blur(2px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 10;
      border-radius: 18px;
    }
    .countdown-badge {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--accent);
    }
    .prep-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 720px) {
      .prep-grid { grid-template-columns: 1fr; }
    }
    .form-phone-portrait .prep-grid { grid-template-columns: 1fr; }
    .prep-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .prep-card h3 { margin: 0; font-size: 16px; }
    .target-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .target-chips .chip[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: transparent;
      font-weight: 700;
    }
    .watch-token-focus {
      font-size: 32px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.1;
    }
    .watch-neighbors {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      gap: 10px;
      justify-content: center;
    }
  </style>
</head>
<body>
  <header class="lab-bar" aria-label="Параметры прототипа">
    <div class="lab-group">
      <span class="lab-label">Этап:</span>
      <button class="lab-btn" data-screen="prep" aria-pressed="false">Подготовка</button>
      <button class="lab-btn" data-screen="warmup" aria-pressed="false">Разминка (артикул.)</button>
